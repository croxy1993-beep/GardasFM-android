name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Proje Dosyalarını Bul ve Çalıştır
        run: |
          # settings.gradle.kts dosyasının nerede olduğunu buluyoruz
          SETTINGS_PATH=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "HATA: settings.gradle.kts dosyası depoda hiç bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Proje dizini bulundu: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x gradlew || true
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: APK Hazırla
        run: |
          FOUND_APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" GardasFM.apk
          else
            echo "HATA: Derlenen APK bulunamadı!"
            exit 1
          fi

      - name: Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM.apk
          make_latest: true
