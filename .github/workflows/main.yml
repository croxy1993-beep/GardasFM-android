name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v5

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradlew Yetkisi Ver
        run: chmod +x gradlew || true

      - name: APK Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: APK Hazırla
        run: |
          FOUND_APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" GardasFM.apk
          else
            echo "HATA: APK bulunamadı!"
            exit 1
          fi

      - name: Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM.apk
          make_latest: true
