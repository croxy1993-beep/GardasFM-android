name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v5

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradlew İzinlerini Ver
        run: |
          chmod +x gradlew || true
          chmod +x app/build.gradle.kts || true

      - name: Gradle ile APK Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: APK Hazırla
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk GardasFM-android.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk GardasFM-android.apk
          fi

      - name: APK Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: GardasFM-android-apk
          path: GardasFM-android.apk

      - name: Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM-android.apk
          make_latest: true
          
