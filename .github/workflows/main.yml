name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradlew Yetkisi Ver
        run: chmod +x gradlew || true

      - name: Proje Dosyalarını Kontrol Et
        run: |
          ls -la
          test -f settings.gradle.kts || { echo "HATA: settings.gradle.kts yok."; exit 1; }
          test -f app/build.gradle.kts || { echo "HATA: app/build.gradle.kts yok."; exit 1; }

      - name: APK Derle
        run: ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: APK Adını Düzenle
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk GardasFM-android.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk GardasFM-android.apk
          fi

      - name: APK'yı Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: GardasFM-android-apk
          path: GardasFM-android.apk

      - name: Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM-android.apk
          make_latest: true
