name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK ve Gradle Ayarla
        uses: gradle/actions/setup-gradle@v3

      - name: Gradlew Yetkisi Ver
        run: chmod +x gradlew || true

      - name: APK Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: APK Dosyasını Bul ve Kopyala
        run: |
          FOUND_APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" GardasFM-android.apk
          else
            echo "HATA: Derlenen APK bulunamadı!"
            exit 1
          fi

      - name: APK Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: GardasFM-android-apk
          path: GardasFM-android.apk

      - name: Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM-android.apk
          make_latest: true
          
