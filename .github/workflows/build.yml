name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Java 21 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 8.10.2 kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: İmza anahtarını hazırla ve doğrula
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HATA: KEYSTORE_BASE64 gizli bilgisi boş ya da eklenmemiş."; exit 1; fi
          B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          KS_ALIAS=$(printf '%s' "$KS_ALIAS" | tr -d '[:space:]')
          KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '[:space:]')
          echo "KEYSTORE_BASE64 uzunluğu: ${#B64} (olması gereken: 3512)"
          echo "KEYSTORE_PASSWORD uzunluğu: ${#KS_PASS} (olması gereken: 24)"
          echo "KEY_ALIAS uzunluğu: ${#KS_ALIAS} (olması gereken: 6)"
          echo "KEY_PASSWORD uzunluğu: ${#KEY_PASS} (olması gereken: 24)"
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/gardas.keystore" || { echo "HATA: KEYSTORE_BASE64 bozuk, yeniden yapıştır."; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/gardas.keystore" -storepass "$KS_PASS" -storetype pkcs12 > /dev/null 2>&1; then
            echo "HATA: Anahtar dosyası açılamadı. KEYSTORE_PASSWORD yanlış ya da KEYSTORE_BASE64 eksik kopyalanmış."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/gardas.keystore" -storepass "$KS_PASS" -storetype pkcs12 -alias "$KS_ALIAS" > /dev/null 2>&1; then
            echo "HATA: KEY_ALIAS yanlış. Dosyadaki gibi küçük harfle yazılmalı."
            exit 1
          fi
          if [ "$KS_PASS" != "$KEY_PASS" ]; then
            echo "HATA: KEYSTORE_PASSWORD ile KEY_PASSWORD aynı olmalı."
            exit 1
          fi
          echo "Anahtar doğrulandı: dosya, alias ve şifre doğru."
          echo "GARDAS_KEYSTORE=$RUNNER_TEMP/gardas.keystore" >> "$GITHUB_ENV"
          echo "GARDAS_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "GARDAS_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "GARDAS_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: APK derle
        run: |
          SETTINGS_PATH=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "HATA: settings.gradle.kts bulunamadı!"
            exit 1
          fi
          cd "$(dirname "$SETTINGS_PATH")"
          gradle assembleRelease --no-daemon

      - name: APK hazırla
        run: |
          FOUND_APK=$(find . -path "*outputs/apk/release*" -name "*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            echo "HATA: Derlenen APK bulunamadı!"
            exit 1
          fi
          cp "$FOUND_APK" GardasFM.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Gardaş FM v${{ github.run_number }}
          files: GardasFM.apk
          make_latest: true
