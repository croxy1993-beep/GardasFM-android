<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gardaş FM</title>
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#ff4f8b}
@property --b{syntax:'<color>';inherits:true;initial-value:#4db8ff}
:root{--a:#ff4f8b;--b:#4db8ff;--bg:#0a0720;--text:#f3f0ff;--soft:#b9b3e0;--muted:#8a85b5;transition:--a 1s ease,--b 1s ease;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;overflow:hidden;user-select:none}
input,textarea{user-select:text}
body.a-hafif *{animation-duration:.01s!important}body.a-hafif .amb{transition:none!important}
body.a-kapali *{animation:none!important;transition:none!important}
.amb{position:fixed;inset:-25%;z-index:0;background-size:cover;background-position:center;filter:blur(80px) saturate(1.5) brightness(.75);transform:scale(1.15);transition:opacity 1.5s ease;opacity:0}
.noise{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 40%,transparent 30%,rgba(5,3,15,.7));pointer-events:none}
.app{position:relative;z-index:2;display:grid;grid-template-columns:240px 1fr 350px;grid-template-rows:minmax(0,1fr) 92px;gap:14px;height:100%;padding:14px}
.glass{position:relative;border-radius:24px;background:rgba(20,14,48,.55);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(160deg,var(--a),var(--b));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none}
.rail,.main,.np,.player{animation:pop .8s 2.3s cubic-bezier(.2,.9,.2,1) both}.main{animation-delay:2.4s}.np{animation-delay:2.5s}.player{animation-delay:2.6s}
.rail{padding:20px 12px 12px;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em;font-size:1.25rem;margin:0 8px 2px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand img{width:30px;height:30px;border-radius:8px;-webkit-text-fill-color:initial}
.hello{font-size:.8rem;color:var(--muted);margin:0 8px 14px}
.nav{flex:1;overflow:auto;scrollbar-width:thin;min-height:0}
.nav button,.foot button{position:relative;display:flex;justify-content:space-between;width:100%;height:40px;margin-bottom:3px;text-align:left;padding:0 14px;align-items:center;border:1.5px solid transparent;background:none;color:var(--soft);font-family:inherit;font-size:.93rem;font-weight:600;border-radius:13px;cursor:pointer;transition:color .3s,transform .3s,background .3s,border-color .3s}
.nav button small{color:var(--muted);font-weight:400}
.nav button:hover,.foot button:hover{color:#fff;transform:translateX(4px)}
.nav button.on,.foot button.on{color:#fff;border-color:var(--a);background:color-mix(in srgb,var(--a) 18%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--a) 40%,transparent)}
.nav .grp{font-size:.7rem;letter-spacing:.14em;color:var(--muted);margin:14px 10px 6px;user-select:none}.nav .grp.fold{cursor:pointer}
.nav .grp.col::after{content:" ▸"}.nav .grp.opn::after{content:" ▾"}
.foot{border-top:1px solid rgba(255,255,255,.1);padding-top:8px;margin-top:6px}.foot button{height:36px;font-size:.88rem}
.main{padding:22px 24px;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:18px;margin-bottom:14px}.head h1{font-size:2rem;font-weight:900;white-space:nowrap}
.head input{margin-left:auto;width:100%;max-width:360px;height:42px;border-radius:21px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;padding:0 18px;font:inherit;outline:none;transition:.3s}
.head input:focus{border-color:var(--b);box-shadow:0 0 0 4px color-mix(in srgb,var(--b) 22%,transparent)}
.views{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.view-anim{animation:viewIn .6s cubic-bezier(.2,.9,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.row{display:grid;grid-template-columns:30px 1fr 150px 50px 32px 32px 32px 32px;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;cursor:pointer;color:var(--soft);transition:background .3s,transform .3s;animation:rowIn .55s calc(var(--i)*35ms) cubic-bezier(.2,.9,.2,1) both}
.row:hover{background:rgba(255,255,255,.07);transform:translateX(6px);color:#fff}
.row.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 32%,transparent),transparent);color:#fff;font-weight:600;box-shadow:inset 3px 0 var(--a)}
.row.over{outline:2px dashed var(--b)}
.row .n{color:var(--muted);font-size:.85rem}.row>div:nth-child(2),.row>div:nth-child(3){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row>div:nth-child(3){font-size:.88rem}
.chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:9px;font-size:.7rem;background:color-mix(in srgb,var(--b) 25%,transparent);color:var(--b);font-weight:600}
.ib{border:0;background:none;color:var(--muted);font-size:1.05rem;cursor:pointer;border-radius:10px;height:30px;transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .2s}
.ib:hover{transform:scale(1.25);color:#fff}.ib.fav{color:var(--a);text-shadow:0 0 12px var(--a)}.ib.on{color:var(--b)}
.empty{color:var(--muted);padding:40px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;height:120px;border-radius:20px;padding:16px;cursor:pointer;overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s;animation:rowIn .6s calc(var(--i)*70ms) cubic-bezier(.2,.9,.2,1) both;color:#fff}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 40px rgba(0,0,0,.45)}.card b{display:block;font-size:1.08rem}.card span{font-size:.82rem;opacity:.9}
.sec{margin:20px 4px 10px;font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.tools{display:flex;gap:10px;margin:0 4px 12px;flex-wrap:wrap}
.tb{height:36px;padding:0 16px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--b) 60%,transparent);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:.25s}
.tb:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}.tb.pri{background:var(--a);border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--a) 55%,transparent)}.tb.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 25%,transparent)}
.pcard{border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:20px 22px;margin:0 4px 16px;animation:viewIn .6s both}
.pcard h3{font-size:.78rem;letter-spacing:.14em;color:var(--a);margin-bottom:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.srow:first-of-type{border-top:0}
.srow small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px;max-width:420px}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);cursor:pointer;transition:.3s;flex:0 0 auto}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:var(--a);box-shadow:0 0 16px color-mix(in srgb,var(--a) 60%,transparent)}.sw.on::after{left:23px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{height:32px;padding:0 14px;border-radius:16px;border:1.5px solid rgba(255,255,255,.18);background:none;color:var(--soft);font-family:inherit;font-size:.83rem;cursor:pointer;transition:.25s}.seg button.on{border-color:var(--a);color:#fff;background:color-mix(in srgb,var(--a) 22%,transparent)}
.in{height:36px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:0 12px;font:inherit;outline:none;min-width:200px}
.big{font-size:1.9rem;font-weight:900;margin:4px 0}.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--a)}
.np{padding:22px;display:flex;flex-direction:column;align-items:center;min-height:0}
.stagebox{position:relative;width:200px;height:200px;margin:8px 0 16px;flex:0 0 auto}
#viz{position:absolute;inset:-60px;width:320px;height:320px;pointer-events:none}
.cover{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;font-size:4rem;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .15s ease-out;box-shadow:0 20px 60px color-mix(in srgb,var(--a) 50%,transparent)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}.cover img.on{opacity:1}
.ntitle{display:flex;align-items:center;gap:6px;max-width:100%}.np h2{font-size:1.15rem;text-align:center;max-height:3.2em;overflow:hidden}.np .art{color:var(--b);font-size:.95rem;margin:2px 0 8px}
.lyr{flex:1;min-height:0;width:100%;overflow:hidden;position:relative;mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.lyr-in{transition:transform .7s cubic-bezier(.2,.9,.2,1)}
.lyr-in div{padding:7px 4px;text-align:center;font-size:.98rem;color:var(--muted);filter:blur(1px);transition:all .5s cubic-bezier(.2,.9,.2,1)}
.lyr-in div.on{color:var(--b);font-weight:800;font-size:1.22rem;filter:none;text-shadow:0 0 18px color-mix(in srgb,var(--b) 60%,transparent)}.lyr-in.plain div{filter:none;color:var(--soft)}
.player{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 26px}
.pinfo{width:210px;min-width:0}.pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo span{font-size:.82rem;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{width:42px;height:42px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--b) 70%,transparent);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
.ctl button:hover{transform:scale(1.12);background:rgba(255,255,255,.12)}.ctl button:active{transform:scale(.92)}
.ctl .pp{width:56px;height:56px;border-radius:50%;border:0;background:var(--a);font-size:1.25rem;box-shadow:0 0 26px color-mix(in srgb,var(--a) 70%,transparent)}
.ctl .sm{width:36px;height:36px;border-color:rgba(255,255,255,.2);font-size:.9rem}.ctl .sm.on{border-color:var(--a);color:var(--a);box-shadow:0 0 14px color-mix(in srgb,var(--a) 50%,transparent)}
.prog{flex:1;display:flex;align-items:center;gap:12px;font-size:.82rem;color:var(--soft)}
.track{position:relative;flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.14);cursor:pointer}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b))}
.track u{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--b);transition:transform .2s}.track:hover u{transform:scale(1.35)}
input[type=range]{accent-color:var(--b);width:90px}
.toast{position:fixed;left:50%;bottom:122px;z-index:120;padding:12px 22px;border-radius:999px;background:rgba(20,14,48,.94);border:1.5px solid var(--a);transform:translate(-50%,30px);opacity:0;transition:.45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.pm{position:fixed;z-index:110;min-width:190px;max-height:340px;overflow:auto;border-radius:16px;background:rgba(18,12,44,.97);border:1px solid rgba(255,255,255,.14);padding:6px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pm div{padding:9px 14px;border-radius:10px;font-size:.9rem;color:var(--soft);cursor:pointer}.pm div:hover{background:rgba(255,255,255,.1);color:#fff}.pm div.sep{height:1px;padding:0;margin:4px 8px;background:rgba(255,255,255,.12);cursor:default}.pm div.hd{font-size:.7rem;letter-spacing:.12em;color:var(--muted);cursor:default}.pm div.hd:hover{background:none;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:130;display:none;place-items:center;background:rgba(5,3,15,.82);backdrop-filter:blur(12px)}.ov.on{display:grid}
.obox{width:min(460px,92vw);padding:28px;border-radius:24px;background:rgba(22,15,52,.98);border:1.5px solid var(--a);box-shadow:0 24px 70px rgba(0,0,0,.6);text-align:center;animation:pop .5s both}
.obox img{width:84px;height:84px;border-radius:20px;margin-bottom:8px}.obox h2{font-size:1.5rem;margin-bottom:6px}.obox p{color:var(--soft);font-size:.92rem;line-height:1.6;margin:6px 0}.obox .bt{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.obox ul{text-align:left;margin:10px 0 0 18px;color:var(--soft);font-size:.88rem;line-height:1.6}
.pb{height:8px;border-radius:6px;background:rgba(255,255,255,.14);margin:14px 0 4px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
#dlg .obox{text-align:left}#dlg input{width:100%;height:42px;border-radius:14px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:0 14px;font:inherit;outline:none;margin:8px 0}
#fs{position:fixed;inset:0;z-index:100;display:none;background:rgba(6,4,18,.94);backdrop-filter:blur(30px);overflow:hidden}#fs.on{display:block;animation:viewIn .5s both}
#fs .fl{position:absolute;inset:70px 8% 60px 8%;overflow:hidden;mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
#fs .lyr-in div{font-size:2rem;padding:14px 0;color:var(--muted);filter:blur(2px);text-align:center}#fs .lyr-in div.on{font-size:3.2rem;font-weight:900;color:var(--b);filter:none;text-shadow:0 0 30px color-mix(in srgb,var(--b) 60%,transparent)}
#fs .ft{position:absolute;top:22px;left:0;right:0;text-align:center;color:var(--soft)}#fs .x{position:absolute;top:14px;right:22px;font-size:1.6rem}
.lost{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:rgba(5,3,15,.9);text-align:center;color:var(--soft);line-height:1.8}
/* açılış animasyonu */
#splash{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#1a1040 0%,#070416 70%);overflow:hidden;transition:opacity .9s ease,transform .9s ease,filter .9s}
#splash.out{opacity:0;transform:scale(1.08);filter:blur(10px);pointer-events:none}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center}
.sp-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 45%,transparent),transparent 65%);filter:blur(30px);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(.8);opacity:.5}to{transform:scale(1.15);opacity:1}}
.sp-ring{position:absolute;top:50%;left:50%;width:240px;height:240px;margin:-130px 0 0 -120px;border-radius:50%;border:2px solid var(--a);opacity:0;animation:ring 2.4s cubic-bezier(.2,.7,.3,1) infinite}.sp-ring.r2{border-color:var(--b);animation-delay:.8s}.sp-ring.r3{animation-delay:1.6s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.sp-wrap{position:relative;width:230px;height:230px;border-radius:46px;overflow:hidden;animation:logoIn 1.7s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 0 80px color-mix(in srgb,var(--a) 55%,transparent),0 0 0 1.5px rgba(255,255,255,.2)}
.sp-wrap img{width:100%;height:100%;display:block;object-fit:cover}
.sp-wrap::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);transform:translateX(-130%);animation:sweep 1.5s 1s ease-in-out forwards}
@keyframes logoIn{0%{opacity:0;transform:scale(.45) rotate(-12deg);filter:blur(28px) brightness(2.2)}55%{opacity:1;filter:blur(0) brightness(1.35)}100%{opacity:1;transform:none;filter:none}}
@keyframes sweep{to{transform:translateX(130%)}}
.sp-text{position:relative;margin-top:34px;font-size:2.2rem;font-weight:900;letter-spacing:.22em;display:flex;gap:2px}
.sp-text span{opacity:0;transform:translateY(24px);background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;animation:letter .6s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.sp-sub{position:relative;margin-top:8px;color:var(--muted);font-size:.9rem;letter-spacing:.3em;opacity:0;animation:letter .8s 2s forwards}
.sp-bar{position:relative;width:240px;height:4px;margin-top:26px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));animation:load 2.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{to{width:100%}}
@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.np{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="splash"><div class="sp-in"><div class="sp-glow"></div><div class="sp-ring"></div><div class="sp-ring r2"></div><div class="sp-ring r3"></div>
 <div class="sp-wrap"><img id="splogo" alt=""></div><div class="sp-text" id="sptext"></div><div class="sp-sub">MÜZİĞİN NEON EVİ</div><div class="sp-bar"><i></i></div></div></div>
<div class="amb" id="amb1"></div><div class="amb" id="amb2"></div><div class="noise"></div>
<div class="app">
 <aside class="glass rail"><div class="brand"><img id="brandlogo" alt="">GARDAŞ FM</div><div class="hello" id="hello"></div><div class="nav" id="nav"></div>
  <div class="foot"><button data-go="profile">☺&nbsp; Profil</button><button data-go="settings">⚙&nbsp; Ayarlar</button><button data-go="help">?&nbsp; Kısayollar</button><button id="bq">⏻&nbsp; Çıkış</button></div></aside>
 <main class="glass main"><div class="head"><h1 id="title">Ana sayfa</h1><input id="q" placeholder="Şarkı ya da sanatçı ara, Enter'a bas..." autocomplete="off"></div><div class="views" id="views"></div></main>
 <aside class="glass np"><div class="stagebox"><canvas id="viz" width="640" height="640"></canvas><div class="cover" id="cover"><span id="ph">🎧</span><img id="cimg" alt=""></div></div>
  <div class="ntitle"><h2 id="ntitle">Bir şarkı seç</h2><button class="ib" id="nfav" title="Favori">♡</button><button class="ib" id="nfs" title="Tam ekran sözler (L)">⛶</button></div><div class="art" id="nart"></div><div class="lyr"><div class="lyr-in" id="lyr"></div></div></aside>
 <footer class="glass player"><div class="pinfo"><b id="ptitle">—</b><span id="part"></span></div>
  <div class="ctl"><button class="sm" id="shuf" title="Karışık">⇄</button><button id="prev">⏮</button><button class="pp" id="pp">▶</button><button id="next">⏭</button><button class="sm" id="rep" title="Tekrar">↻</button></div>
  <div class="prog"><span id="tcur">0:00</span><div class="track" id="track"><i id="fill"></i><u id="knob"></u></div><span id="ttot">0:00</span></div>
  <div class="ctl"><button class="sm" id="slp" title="Uyku zamanlayıcı">☾</button><button class="sm" id="eqb" title="Ekolayzer ve hız">♫</button></div><input type="range" id="vol" min="0" max="100" value="70" title="Ses"></footer>
</div>
<div id="fs"><div class="ft" id="fst"></div><button class="ib x" id="fsx">✕</button><div class="fl"><div class="lyr-in" id="lyr2"></div></div></div>
<div class="pm" id="pm"></div><div class="toast" id="toast"></div>
<div class="ov" id="dlg"><div class="obox"><div id="dt"></div><input id="di"><div class="bt"><button class="tb" id="dno">İptal</button><button class="tb pri" id="dok">Tamam</button></div></div></div>
